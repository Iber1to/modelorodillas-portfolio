<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">ModeloRodillas: del DICOM a puntuaciones por hallazgo</title><desc id="desc">Esquema conceptual de cuatro etapas: RM, preprocesado, CoAtNet cinco folds y agregación por rangos para doce hallazgos. No contiene imágenes clínicas.</desc><rect width="1200" height="360" rx="20" fill="#101B2D"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="55" fill="#F4F7FC" font-size="28" font-weight="700">ModeloRodillas · pipeline de investigación</text><g fill="#1C2C44" stroke="#70DDD0"><rect x="40" y="95" width="245" height="130" rx="12"/><rect x="330" y="95" width="245" height="130" rx="12"/><rect x="620" y="95" width="245" height="130" rx="12"/><rect x="910" y="95" width="245" height="130" rx="12"/></g><g fill="#F4F7FC" font-size="23" text-anchor="middle"><text x="162" y="145">RM de rodilla</text><text x="452" y="145">Preprocesado</text><text x="742" y="145">CoAtNet</text><text x="1032" y="145">12 puntuaciones</text></g><g fill="#C5D1E2" font-size="20" text-anchor="middle"><text x="162" y="183">DICOM + metadatos</text><text x="452" y="183">42 ventanas · 336 px</text><text x="742" y="183">5 folds congelados</text><text x="1032" y="183">Rangos por hallazgo</text></g><g fill="#70DDD0" font-size="28"><text x="296" y="164">→</text><text x="586" y="164">→</text><text x="876" y="164">→</text></g><text x="40" y="278" fill="#70DDD0" font-size="21">Hashes de fuentes y pesos · entorno documentado · comprobación de salidas</text><text x="40" y="323" fill="#FFD28A" font-size="20">Esquema conceptual. Esta edición pública no distribuye datos clínicos ni pesos.</text></g></svg>